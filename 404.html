<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - الصفحة غير موجودة | TechnoMind</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/enhancements.css">
    <link rel="icon" type="image/svg+xml" href="images/logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .error-code {
            font-size: clamp(100px, 20vw, 200px);
            font-weight: 900;
            background: linear-gradient(135deg, var(--color-primary, #38BDF8), var(--color-accent-pink, #F472B6));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 16px;
            animation: float 6s ease-in-out infinite;
        }

        .error-title {
            font-size: 28px;
            color: white;
            margin-bottom: 16px;
        }

        .error-desc {
            font-size: 18px;
            color: var(--color-neutral-400);
            max-width: 500px;
            margin: 0 auto 40px;
            line-height: 1.6;
        }

        .error-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .error-actions a {
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 700;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .error-actions .primary {
            background: var(--color-primary, #38BDF8);
            color: white;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.3);
        }

        .error-actions .primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(56, 189, 248, 0.5);
        }

        .error-actions .secondary {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .error-actions .secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }
    </style>
</head>

<body>
    <div class="error-page">
        <div>
            <div class="error-code">404</div>
            <h1 class="error-title">الصفحة غير موجودة</h1>
            <p class="error-desc">
                يبدو أن الصفحة التي تبحث عنها قد تم نقلها أو حذفها. لا تقلق، يمكنك العودة واستكشاف المزيد!
            </p>
            <div class="error-actions">
                <a href="index.html" class="primary">العودة للرئيسية</a>
                <a href="pages/tools-directory.html" class="secondary">تصفح الأدوات</a>
            </div>
        </div>
    </div>

    <script src="js/enhancements.js"></script>
</body>

</html>
