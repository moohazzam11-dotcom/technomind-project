<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Premium Gradient: Deep Indigo to Vibrant Cyan -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" /> <!-- Indigo 600 -->
      <stop offset="50%" style="stop-color:#0EA5E9;stop-opacity:1" /> <!-- Sky 500 -->
      <stop offset="100%" style="stop-color:#2DD4BF;stop-opacity:1" /> <!-- Teal 400 -->
    </linearGradient>
    
    <!-- Subtle Depth Shadow -->
    <filter id="dropshadow" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/> 
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>

  <!-- Background Container (Optional, for App Icon feel) -->
  <!-- <rect x="20" y="20" width="472" height="472" rx="128" fill="#0f172a" /> -->

  <!-- The "Neural Nexus" Symbol -->
  <g transform="translate(256, 256)" filter="url(#dropshadow)">
    
    <!-- Outer Orbit - The "World" of Tech -->
    <path d="M-160 0 A 160 160 0 1 1 160 0 A 160 160 0 1 1 -160 0" 
          fill="none" stroke="url(#mainGrad)" stroke-width="24" stroke-linecap="round" 
          stroke-dasharray="80 30" opacity="0.2">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite" />
    </path>

    <!-- The Core Mark - Abstract Brain/Network -->
    <!-- Left Lobe (Human) -->
    <path d="M-40 -120 C -120 -120, -140 -40, -100 20 C -60 80, -40 80, 0 140" 
          fill="none" stroke="url(#mainGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
          
    <!-- Right Lobe (AI) -->
    <path d="M40 -120 C 120 -120, 140 -40, 100 20 C 60 80, 40 80, 0 140" 
          fill="none" stroke="url(#mainGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
          
    <!-- Central Node (Connection) -->
    <circle cx="0" cy="-60" r="32" fill="white">
        <animate attributeName="r" values="32;36;32" dur="3s" repeatCount="indefinite" />
        <animate attributeName="fill-opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite" />
    </circle>
    
    <!-- Data Spark -->
    <circle cx="0" cy="140" r="16" fill="#2DD4BF" />

  </g>
</svg>
