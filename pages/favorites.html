<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorites - TechnoMind</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/enhancements.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="../js/lang.js"></script>
    <script src="../js/data/articles.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <style>
        /* Reusing directory styles */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            margin-top: 40px;
        }

        .tool-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
        }

        .tool-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(56, 189, 248, 0.3);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .btn-try {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--color-primary);
            font-weight: bold;
            font-size: 14px;
        }

        .fav-btn {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 32px;
            height: 32px;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            z-index: 10;
        }

        [dir="ltr"] .fav-btn {
            right: 16px;
            left: auto;
        }
    </style>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../images/logo.svg">
    <link rel="apple-touch-icon" href="../images/logo.png">
</head>

<body>
    <header>
        <div class="container">
            <a href="../index.html" class="logo"><img src="../images/logo.svg" style="height:40px; margin-left:8px;">
                TechnoMind</a>
            <nav class="nav-links">
                <a href="../index.html">الرئيسية</a>
                <a href="tools-directory.html">أدوات الذكاء الاصطناعي</a>
                <button id="langBtn" class="lang-btn">English</button>
            </nav>
            <div class="header-actions">
                <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" aria-label="Toggle Theme">
                    <svg class="icon-svg" viewBox="0 0 24 24" id="themeIconSvg">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <button class="icon-btn" onclick="toggleMainMenu()" aria-label="Toggle Menu">
                    <svg class="icon-svg" viewBox="0 0 24 24">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="menu-dropdown" id="mainMenu">
                <div class="menu-section-label">التنقل / Navigation</div>
                <a href="../index.html" class="menu-item" data-en="Home">
                    <svg class="menu-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    <span class="text">الرئيسية</span>
                </a>
                <a href="ai-simplified.html" class="menu-item" data-en="AI Simplified">
                    <svg class="menu-icon" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z"></path><path d="M12 8v4l3 3"></path></svg>
                    <span class="text">الذكاء الاصطناعي</span>
                </a>
                <a href="courses.html" class="menu-item" data-en="Courses">
                    <svg class="menu-icon" viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c0 2 4 3 6 3s6-1 6-3v-5"></path></svg>
                    <span class="text">الدورات التعليمية</span>
                </a>
                <a href="tools-directory.html" class="menu-item" data-en="AI Tools">
                    <svg class="menu-icon" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
                    <span class="text">أدوات الذكاء الاصطناعي</span>
                </a>
                <a href="make-money.html" class="menu-item" data-en="Earn Online" style="color: var(--color-section-earn);">
                    <svg class="menu-icon" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                    <span class="text">الربح من الإنترنت</span>
                </a>
                <div class="menu-divider"></div>
                <div class="menu-section-label">الحساب / Account</div>
                <a href="signup.html" class="menu-item" id="menu-login-item" data-en="Login / Register">
                    <svg class="menu-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <span class="text">👤 تسجيل الدخول / حساب جديد</span>
                </a>
                <a href="contact.html?subject=support" class="menu-item" data-en="Support">
                    <svg class="menu-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                    <span class="text">الدعم الفني</span>
                </a>
            </div>
        </div>
    </header>

    <header class="hero-section"
        style="min-height: 30vh; display: flex; align-items: center; justify-content: center; text-align: center;">
        <div class="hero-content">
            <h1 data-en="My Favorites">مفضلاتي</h1>
            <p data-en="Your saved collection of AI tools.">مجموعتك المحفوظة من أدوات الذكاء الاصطناعي.</p>
        </div>
    </header>

    <div class="container" style="margin-bottom: 80px;" id="favContainer">
        <!-- Tools will load here -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderFavorites();
            window.addEventListener('languageChanged', renderFavorites);
            window.addEventListener('favoritesUpdated', renderFavorites); // Re-render if item removed
        });

        function renderFavorites() {
            const favIds = window.db.getFavorites();
            const container = document.getElementById('favContainer');
            const isEn = document.documentElement.lang === 'en';

            if (favIds.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <span style="font-size: 48px; display: block; margin-bottom: 20px;">💔</span>
                        <h3 style="color: white;" data-en="No favorites yet">${isEn ? "No favorites yet" : "لا يوجد مفضلات بعد"}</h3>
                        <p style="color: #888; margin-bottom: 20px;" data-en="Go explore and save tools you like!">${isEn ? "Go explore and save tools you like!" : "تصفح الموقع واحفظ الأدوات التي تعجبك!"}</p>
                        <a href="tools-directory.html" class="btn btn-primary" data-en="Explore Tools">${isEn ? "Explore Tools" : "تصفح الأدوات"}</a>
                    </div>
                `;
                return;
            }

            const tools = window.technoMindTools.filter(t => favIds.includes(t.id));

            const html = tools.map(tool => {
                const title = isEn ? tool.title_en || tool.title : tool.title;
                const summary = isEn ? tool.summary_en || tool.summary : tool.summary;
                const category = isEn ? tool.category_en || tool.category : tool.category;
                const btnText = isEn ? "View Details" : "عرض التفاصيل";
                const arrow = isEn ? "→" : "←";

                return `
                <div class="tool-card" onclick="window.location.href='tool-viewer.html?id=${tool.id}'">
                    <!-- Remove Button (Heart is active) -->
                    <div class="fav-btn" onclick="event.stopPropagation(); removeFav(${tool.id})" title="Remove">
                        ♥
                    </div>

                    <div class="tool-header" style="display: flex; align-items: center; gap: 15px; margin-bottom: 15px;">
                        <div style="font-size: 32px;">${tool.icon}</div>
                        <span style="background: rgba(56, 189, 248, 0.1); color: var(--color-primary); padding: 4px 12px; border-radius: 20px; font-size: 12px;">${category}</span>
                    </div>
                    
                    <h3 style="color: white; margin-bottom: 10px;">${title}</h3>
                    <p style="color: #ccc; font-size: 14px; line-height: 1.6; margin-bottom: 20px;">${summary}</p>
                    
                    <div style="margin-top: auto;">
                        <span class="btn-try">
                            ${btnText} 
                            <span style="font-family: initial">${arrow}</span>
                        </span>
                    </div>
                </div>
                `;
            }).join('');

            container.innerHTML = `<div class="tools-grid">${html}</div>`;
        }

        function removeFav(id) {
            if (confirm(document.documentElement.lang === 'en' ? 'Remove from favorites?' : 'إزالة من المفضلات؟')) {
                window.db.toggleFavorite(id);
                // Event listener above will re-render
            }
        }
    </script>
    <script src="../js/enhancements.js"></script>
</body>

</html>
