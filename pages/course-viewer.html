<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Player - TechnoMind</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/enhancements.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

    <!-- Specific Course Player Styles -->
    <style>
        .course-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 0;
            min-height: calc(100vh - 70px);
            /* Adjust for header */
        }

        .course-sidebar {
            background-color: var(--color-surface);
            border-left: 1px solid var(--color-border);
            padding: 20px;
            overflow-y: auto;
            position: relative;
        }

        .course-content {
            padding: 40px;
            background-color: var(--color-background);
            overflow-y: auto;
        }

        .module-title {
            font-weight: 700;
            margin-top: 20px;
            margin-bottom: 10px;
            color: var(--color-text-primary);
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .lesson-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 8px;
            text-decoration: none;
            color: var(--color-text-secondary);
            border: 1px solid transparent;
        }

        .lesson-item:hover {
            background-color: var(--color-neutral-100);
        }

        .lesson-item.active {
            background-color: var(--color-primary-light);
            color: white;
            border-color: var(--color-primary);
        }

        .lesson-item.active:hover {
            background-color: var(--color-primary);
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            /* 16:9 */
            height: 0;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .course-container {
                grid-template-columns: 1fr;
            }

            .course-sidebar {
                order: 2;
                border-left: none;
                border-top: 1px solid var(--color-border);
            }
        }

        .lesson-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background-color: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            color: var(--color-text-primary);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background-color: var(--color-neutral-100);
        }
    </style>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../images/logo.svg">
    <link rel="apple-touch-icon" href="../images/logo.png">
</head>

<body>

    <!-- Simplified Header for Focus Mode -->
    <header style="border-bottom: 1px solid var(--color-border);">
        <div class="container"
            style="display: flex; justify-content: space-between; align-items: center; height: 70px;">
            <a href="courses.html" class="nav-btn">
                <span>←</span> العودة للدورات
            </a>
            <div style="font-weight: bold; color: var(--color-primary);" id="courseHeaderTitle">جارٍ التحميل...</div>
            <div class="header-actions">
                <button class="icon-btn" onclick="toggleTheme()">
                    <svg class="icon-svg" viewBox="0 0 24 24" id="themeIconSvg">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <div class="course-container">
        <!-- Sidebar -->
        <aside class="course-sidebar" id="courseSidebar">
            <!-- Injected by JS -->
        </aside>

        <!-- Main Content -->
        <main class="course-content">
            <div class="video-wrapper">
                <iframe id="videoPlayer" src="" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen></iframe>
            </div>

            <div class="lesson-header">
                <div>
                    <h1 id="lessonTitle" style="margin-bottom: 8px;">اختر درساً</h1>
                    <p id="lessonDesc" style="color: var(--color-text-secondary);"></p>
                </div>
            </div>

            <div
                style="display: flex; justify-content: space-between; padding-top: 24px; border-top: 1px solid var(--color-border);">
                <button id="prevBtn" class="nav-btn" disabled>السابق</button>
                <button id="nextBtn" class="nav-btn" disabled>التالي</button>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../js/data/courses.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/course-player.js"></script>
    <script src="../js/main.js"></script> <!-- For theme toggle -->
    <script src="../js/enhancements.js"></script>
    <script src="../js/lang.js"></script>
</body>

</html>
