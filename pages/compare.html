<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare AI Tools - TechnoMind</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/enhancements.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="../js/lang.js"></script>
    <script src="../js/data/articles.js"></script>
    <script src="../js/tools.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <style>
        .compare-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 40px;
        }

        .compare-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
        }

        .vs-badge {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: var(--color-primary);
            color: white;
            font-weight: bold;
            padding: 10px 15px;
            border-radius: 50%;
            z-index: 10;
        }

        .comparison-row {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
        }

        .label {
            color: var(--color-neutral-400);
            font-size: 14px;
            display: block;
            margin-bottom: 8px;
        }
    </style>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../images/logo.svg">
    <link rel="apple-touch-icon" href="../images/logo.png">
</head>

<body>
    <header>
        <div class="container">
            <a href="../index.html" class="logo"><img src="../images/logo.svg" style="height:40px; margin-left:8px;">
                TechnoMind</a>
            <nav class="nav-links">
                <a href="../index.html">الرئيسية</a>
                <a href="tools-directory.html">أدوات الذكاء الاصطناعي</a>
                <button id="langBtn" class="lang-btn">English</button>
            </nav>
            <div class="header-actions">
                <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" aria-label="Toggle Theme">
                    <svg class="icon-svg" viewBox="0 0 24 24" id="themeIconSvg">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <button class="icon-btn" onclick="toggleMainMenu()" aria-label="Toggle Menu">
                    <svg class="icon-svg" viewBox="0 0 24 24">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="menu-dropdown" id="mainMenu">
                <div class="menu-section-label">التنقل / Navigation</div>
                <a href="../index.html" class="menu-item" data-en="Home">
                    <svg class="menu-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    <span class="text">الرئيسية</span>
                </a>
                <a href="ai-simplified.html" class="menu-item" data-en="AI Simplified">
                    <svg class="menu-icon" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z"></path><path d="M12 8v4l3 3"></path></svg>
                    <span class="text">الذكاء الاصطناعي</span>
                </a>
                <a href="courses.html" class="menu-item" data-en="Courses">
                    <svg class="menu-icon" viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c0 2 4 3 6 3s6-1 6-3v-5"></path></svg>
                    <span class="text">الدورات التعليمية</span>
                </a>
                <a href="tools-directory.html" class="menu-item" data-en="AI Tools">
                    <svg class="menu-icon" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
                    <span class="text">أدوات الذكاء الاصطناعي</span>
                </a>
                <a href="make-money.html" class="menu-item" data-en="Earn Online" style="color: var(--color-section-earn);">
                    <svg class="menu-icon" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                    <span class="text">الربح من الإنترنت</span>
                </a>
                <div class="menu-divider"></div>
                <div class="menu-section-label">الحساب / Account</div>
                <a href="signup.html" class="menu-item" id="menu-login-item" data-en="Login / Register">
                    <svg class="menu-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <span class="text">👤 تسجيل الدخول / حساب جديد</span>
                </a>
                <a href="contact.html?subject=support" class="menu-item" data-en="Support">
                    <svg class="menu-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                    <span class="text">الدعم الفني</span>
                </a>
            </div>
        </div>
    </header>

    <header class="hero-section"
        style="min-height: 40vh; display: flex; align-items: center; justify-content: center; text-align: center;">
        <div class="hero-content">
            <h1 data-en="Compare AI Tools">مقارنة الأدوات</h1>
            <p data-en="Select two tools to see which one is right for you.">اختر أداتين لترى أيهما أنسب لك.</p>

            <div class="search-container"
                style="background: rgba(0,0,0,0.5); padding: 20px; border-radius: 12px; margin-top: 30px; display: flex; gap: 10px; max-width: 600px; margin-left: auto; margin-right: auto;">
                <select id="tool1" style="flex: 1; padding: 12px; border-radius: 8px;"></select>
                <div style="align-self: center; font-weight: bold; color: white;">VS</div>
                <select id="tool2" style="flex: 1; padding: 12px; border-radius: 8px;"></select>
            </div>

            <button onclick="renderComparison()" class="btn btn-primary" style="margin-top: 20px; width: 200px;"
                data-en="Compare Now">قارن الآن</button>
        </div>
    </header>

    <div class="container" style="margin-bottom: 80px; position: relative;" id="resultsContainer">
        <!-- Results will appear here -->
        <p style="text-align: center; color: #888; margin-top: 40px;" data-en="Select tools above to start comparison.">
            اختر الأدوات من الأعلى لبدء المقارنة.</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const select1 = document.getElementById('tool1');
            const select2 = document.getElementById('tool2');

            // Populate Dropdowns
            window.technoMindTools.forEach(tool => {
                const opt1 = document.createElement('option');
                opt1.value = tool.id;
                opt1.textContent = tool.title;
                select1.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = tool.id;
                opt2.textContent = tool.title;
                select2.appendChild(opt2);
            });

            // Default selection
            if (window.technoMindTools.length > 1) {
                select2.selectedIndex = 1;
            }
        });

        function renderComparison() {
            const id1 = parseInt(document.getElementById('tool1').value);
            const id2 = parseInt(document.getElementById('tool2').value);
            const t1 = window.technoMindTools.find(t => t.id === id1);
            const t2 = window.technoMindTools.find(t => t.id === id2);

            const stats1 = window.db.getToolStats(id1);
            const stats2 = window.db.getToolStats(id2);

            const isEn = document.documentElement.lang === 'en';

            const html = `
                <div class="compare-grid" style="position: relative;">
                    ${renderCard(t1, stats1, isEn)}
                    ${renderCard(t2, stats2, isEn)}
                    <div class="vs-badge">VS</div>
                </div>
            `;

            document.getElementById('resultsContainer').innerHTML = html;
        }

        function renderCard(tool, stats, isEn) {
            const title = isEn ? tool.title_en || tool.title : tool.title;
            const summary = isEn ? tool.summary_en || tool.summary : tool.summary;
            const category = isEn ? tool.category_en || tool.category : tool.category;

            return `
                <div class="compare-card">
                    <div style="font-size: 40px; margin-bottom: 10px;">${tool.icon}</div>
                    <h2 style="color: white; margin-bottom: 10px;">${title}</h2>
                    <span class="hero-badge" style="margin-bottom: 20px;">${category}</span>
                    
                    <div style="text-align: right; margin-top: 30px;">
                        <span class="label" data-en="Rating">التقييم</span>
                        <div style="font-size: 24px; color: #fbbf24; font-weight: bold;">
                            ${stats.rating || 'N/A'} <span style="font-size: 14px; color: #888;">/ 5</span>
                        </div>
                    </div>

                    <div style="text-align: right; margin-top: 20px;">
                        <span class="label" data-en="Upvotes">عدد الاصوات</span>
                         <div style="font-size: 24px; color: var(--color-primary); font-weight: bold;">
                            ▲ ${stats.upvotes}
                        </div>
                    </div>

                    <div style="text-align: right; margin-top: 20px;">
                        <span class="label" data-en="Description">الوصف</span>
                        <p style="color: #ccc; line-height: 1.6;">${summary}</p>
                    </div>

                     <a href="tool-viewer.html?id=${tool.id}" class="btn btn-secondary" style="margin-top: 30px; width: 100%; display:block;" data-en="View Details">عرض التفاصيل</a>
                </div>
            `;
        }
    </script>
    <script src="../js/enhancements.js"></script>
</body>

</html>
